seed: 0
device: cuda  # falls back to cpu if unavailable

problem:
  n_nodes: 20       # elements to sequence
  batch_size: 512   # instances per batch

algo:
  name: ppo         # ppo | dqn
  lr: 3.0e-4
  gamma: 1.0

train:
  total_steps: 100_000
  log_every: 1_000

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${algo.name}_n${problem.n_nodes}_${now:%H-%M-%S}
  job_logging:
    formatters:
      simple:
        format: "[%(asctime)s][%(levelname)s][%(name)s] %(message)s"
        datefmt: "%H:%M:%S"

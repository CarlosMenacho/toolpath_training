defaults:
  - _self_
  - dataset: thingi10k
  - rewards: reward_weights
  - env: env
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

seed: 123
device: cuda 

problem:
  n_nodes: 20       # elements to sequence
  batch_size: 512   # instances per batch

algo:
  name: ppo         # ppo | dqn
  lr: 3.0e-4
  gamma: 1.0

train:
  total_steps: 100_000
  log_every: 1_000

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${algo.name}_n${problem.n_nodes}_${now:%H-%M-%S}
  job_logging:
    formatters:
      simple:  # file log: plain, no ANSI codes
        format: "[%(asctime)s][%(levelname)s][%(name)s] %(message)s"
        datefmt: "%H:%M:%S"
      colorlog:  # console
        format: "%(cyan)s[%(asctime)s]%(reset)s%(log_color)s[%(levelname)s]%(reset)s%(blue)s[%(name)s]%(reset)s %(message)s"
        datefmt: "%H:%M:%S"
    handlers:
      file:  # plugin default is relative to cwd; keep it in the run dir
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
